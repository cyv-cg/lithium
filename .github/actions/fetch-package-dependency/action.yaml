name: Fetch Package Dependency
description: Finds a dependency either in artifacts or releases

inputs:
  package-name:
    required: true
    description: Name and version of the package, e.g. cyv.Lithium.Core-v1.2.3
  github-token:
    required: true
    description: GitHub access token

runs:
  using: "composite"

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts
      continue-on-error: true

    - name: Find package in artifacts
      id: find
      shell: bash
      run: |
        PACKAGE="${{ inputs.package-name }}"
        FILE_PATH=$(find artifacts -name "$PACKAGE" -type f | head -n 1)

        if [[ -n "$FILE_PATH" ]]; then
          echo "source=artifacts" >> $GITHUB_OUTPUT
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT
        fi

    - name: Download release asset
      if: steps.find.outputs.source != 'artifacts'
      shell: "bash"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download ${{ inputs.package-name }} \
          --repo ${{ github.repository }} \
          --pattern "*.nupkg" \
          --dir downloads

    - name: Upload NuGet package artifact
      if: steps.find.outputs.source != 'artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.package-name }}
        path: downloads/*.nupkg
