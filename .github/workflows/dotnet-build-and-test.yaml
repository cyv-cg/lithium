name: Build and Test Lithium.sln

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      packAndUpload:
        description: "Whether to pack the built solution as a .nupkg and upload the artifact."
        type: boolean
        required: false
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore "Lithium.sln"

      - name: Build
        run: dotnet build "Lithium.sln" --no-restore

      - name: Test with coverage
        run: dotnet test "Lithium.sln" --no-build --verbosity normal --settings tests.runsettings --collect:"XPlat Code Coverage"

      - name: Publish coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "**/TestResults/**/coverage.cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          indicators: true
          output: both
          thresholds: "30 60"

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  pack-and-upload:
    needs: test
    if: ${{ needs.test.result == 'success' && github.event.inputs.packAndUpload }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore "Lithium.sln"

      - name: Build Release configuration
        run: dotnet build "Lithium.sln" --no-restore --configuration Release

      - name: Pack NuGet package
        run: dotnet pack "Lithium.sln" --no-build --configuration Release --output artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
