name: Build and Test Lithium.sln

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      packAndUpload:
        description: "Whether to pack the built solution as a .nupkg and upload the artifact."
        type: boolean
        required: false
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Clean
        run: dotnet clean

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --settings tests.runsettings

      - name: Publish coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "**/TestResults/**/coverage.cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          indicators: true
          output: both
          thresholds: "30 60"

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Pack NuGet package
        if: ${{ inputs.packAndUpload }}
        run: dotnet pack --no-build --configuration Release --output artifacts

      - name: Upload NuGet package artifact
        if: ${{ inputs.packAndUpload }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
