name: Build and Test Lithium.sln

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore "Lithium.sln"

      - name: Build
        run: dotnet build "Lithium.sln" --no-restore

      - name: Test with coverage
        run: dotnet test "Lithium.sln" --no-build --verbosity normal --settings tests.runsettings --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        run: reportgenerator -reports:"tests/**/TestResults/**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"Cobertura"

      - name: Publish coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "coverage/Cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          indicators: true
          output: both
          thresholds: "60 80"

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        with:
          recreate: true
          path: code-coverage-results.md

  pack-and-upload:
    needs: test
    if: ${{ needs.test.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Restore dependencies
        run: dotnet restore "Lithium.sln"

      - name: Build Release configuration
        run: dotnet build "Lithium.sln" --no-restore --configuration Release

      - name: Pack NuGet package (pre-release)
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: dotnet pack "Lithium.sln" -p:PublicRelease=false --no-build --configuration Release --output artifacts

      - name: Pack NuGet package (release)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: dotnet pack "Lithium.sln" -p:PublicRelease=true --no-build --configuration Release --output artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  create-github-release:
    needs: pack-and-upload
    if: ${{ needs.pack-and-upload.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Install NBGV
        run: dotnet tool install -g nbgv

      - name: Get versions
        id: version
        run: |
          echo "meta-version=$(nbgv get-version -v NuGetPackageVersion package)" >> $GITHUB_OUTPUT
          echo "core-version=$(nbgv get-version -v NuGetPackageVersion src/Lithium.Core)" >> $GITHUB_OUTPUT
          echo "defs-version=$(nbgv get-version -v NuGetPackageVersion src/Lithium.Defs)" >> $GITHUB_OUTPUT
          echo "strings-version=$(nbgv get-version -v NuGetPackageVersion src/Lithium.Strings)" >> $GITHUB_OUTPUT

      - name: Create version tags
        run: |
          git tag -f cyv.Lithium-v${{ steps.version.outputs.meta-version }}
          git push origin cyv.Lithium-v${{ steps.version.outputs.meta-version }} --force
          git tag -f cyv.Lithium.Core-v${{ steps.version.outputs.core-version }}
          git push origin cyv.Lithium.Core-v${{ steps.version.outputs.core-version }} --force
          git tag -f cyv.Lithium.Defs-v${{ steps.version.outputs.defs-version }}
          git push origin cyv.Lithium.Defs-v${{ steps.version.outputs.defs-version }} --force
          git tag -f cyv.Lithium.Strings-v${{ steps.version.outputs.strings-version }}
          git push origin cyv.Lithium.Strings-v${{ steps.version.outputs.strings-version }} --force

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Create GitHub Release (Core)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.core-version }}
          name: v${{ steps.version.outputs.core-version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: artifacts/cyv.Lithium.Core.*.nupkg

      - name: Create GitHub Release (Defs)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.defs-version }}
          name: v${{ steps.version.outputs.defs-version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: artifacts/cyv.Lithium.Defs.*.nupkg

      - name: Create GitHub Release (Strings)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.strings-version }}
          name: v${{ steps.version.outputs.strings-version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: artifacts/cyv.Lithium.Strings.*.nupkg

      - name: Pack meta package
        run: |
          dotnet pack package/cyv.Lithium.csproj -c Release -o artifacts/meta \
            -p:CoreVersion=${{ steps.version.outputs.core-version }} \
            -p:DefsVersion=${{ steps.version.outputs.defs-version }} \
            -p:StringsVersion=${{ steps.version.outputs.strings-version }}

      - name: Create GitHub Release (meta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.meta-version }}
          name: v${{ steps.version.outputs.meta-version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: artifacts/meta/*.nupkg
